name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the checkout, it never writes back.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pin to package.json engines / .nvmrc. The lockfile's transitive
          # `skills` package requires Node 22.20+.
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      # CI has no CMS credentials. First verify that an unconfigured production
      # build fails for the intended guard, then compile with neutral demo data.
      - name: CMS guard refuses an unconfigured production build
        run: |
          if npm run build > "$RUNNER_TEMP/guard-build.log" 2>&1; then
            echo "::error::Production build succeeded with no NEXT_PUBLIC_SANITY_PROJECT_ID — the next.config.js guard has regressed."
            exit 1
          fi
          if ! grep -q 'NEXT_PUBLIC_SANITY_PROJECT_ID is not set for a production build' "$RUNNER_TEMP/guard-build.log"; then
            echo "::error::Build failed, but not with the expected CMS guard message:"
            cat "$RUNNER_TEMP/guard-build.log"
            exit 1
          fi

      - run: npm run build:smoke
      - run: npm run budget:bundle
      - run: npm run budget:performance

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Interaction + accessibility suite
        run: npm run test:e2e
        env:
          ALLOW_BUILD_WITHOUT_SANITY: 'true'
