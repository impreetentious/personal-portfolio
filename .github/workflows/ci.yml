name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin to package.json engines / .nvmrc (Node 22.20+; the lockfile's
          # transitive `skills` package requires it).
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      # CI has no CMS credentials, so it cannot run the real production build.
      # Assert the guard that stands in for it: an unconfigured production build
      # must fail, and fail for this reason. Without this step the smoke build
      # below would keep passing even if the guard were deleted.
      - name: CMS guard refuses an unconfigured production build
        run: |
          if npm run build > guard-build.log 2>&1; then
            echo "::error::Production build succeeded with no NEXT_PUBLIC_SANITY_PROJECT_ID — the next.config.js guard has regressed."
            exit 1
          fi
          if ! grep -q 'NEXT_PUBLIC_SANITY_PROJECT_ID is not set for a production build' guard-build.log; then
            echo "::error::Build failed, but not with the expected CMS guard message:"
            cat guard-build.log
            exit 1
          fi

      # Deliberate content-empty smoke build. This proves the app compiles and
      # renders without CMS content; it does not prove the deployed build.
      - run: npm run build
        env:
          ALLOW_BUILD_WITHOUT_SANITY: 'true'
      - run: npm run budget:bundle
      - run: npm run budget:performance

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Interaction + accessibility suite
        run: npm run test:e2e
        env:
          ALLOW_BUILD_WITHOUT_SANITY: 'true'
